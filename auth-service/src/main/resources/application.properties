spring.application.name=auth-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-before-deploying}
security.jwt.issuer=${JWT_ISSUER:cabinet-medical}
security.jwt.expiration=${JWT_EXPIRATION:PT1H}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
